<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#031a2e" />
    <meta name="color-scheme" content="light" />
    <title>Reagansoft Innovation Limited, Software Engineering &amp; Digital Solutions</title>
    <meta name="description" content="Reagansoft Innovation Limited is a software engineering company in Jinja, Uganda. We build websites, mobile apps, management systems, ecommerce and secure digital platforms for organisations across Africa." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Reagansoft Innovation Limited" />
    <meta property="og:title" content="Reagansoft Innovation Limited, Software Engineering &amp; Digital Solutions" />
    <meta property="og:description" content="Enterprise software, websites, mobile apps and management systems engineered in Jinja, Uganda for organisations across Africa." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap"
    />
    <style>
      /* Pre-hydration brand splash: shown the instant the shell paints,
         before React and the CSS bundle finish loading. */
      #rsi-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background: #031a2e;
        color: #fff;
        font-family: 'Space Grotesk', Inter, ui-sans-serif, system-ui, sans-serif;
        isolation: isolate;
        opacity: 1;
        visibility: visible;
        transition: opacity 0.55s ease, visibility 0.55s ease;
      }
      #rsi-splash.rsi-splash-out {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .rsi-splash-bg {
        position: absolute;
        inset: 0;
        z-index: -1;
        background:
          radial-gradient(60% 60% at 50% 42%, rgba(10, 123, 206, 0.38), transparent 70%),
          radial-gradient(42% 42% at 82% 16%, rgba(79, 182, 255, 0.22), transparent 70%),
          radial-gradient(46% 46% at 12% 88%, rgba(120, 90, 255, 0.16), transparent 70%),
          #031a2e;
      }
      .rsi-splash-grid,
      .rsi-splash-scan,
      .rsi-splash-aurora {
        position: absolute;
        pointer-events: none;
      }
      .rsi-splash-grid {
        inset: -10%;
        background-image:
          linear-gradient(rgba(120, 200, 255, 0.09) 1px, transparent 1px),
          linear-gradient(90deg, rgba(120, 200, 255, 0.09) 1px, transparent 1px);
        background-size: 46px 46px;
        mask-image: radial-gradient(60% 60% at 50% 50%, #000 20%, transparent 78%);
        -webkit-mask-image: radial-gradient(60% 60% at 50% 50%, #000 20%, transparent 78%);
        animation: rsiGridDrift 14s linear infinite;
      }
      .rsi-splash-aurora {
        width: 46vmax;
        height: 46vmax;
        border-radius: 50%;
        filter: blur(70px);
        opacity: 0.55;
        mix-blend-mode: screen;
      }
      .rsi-splash-aurora-a {
        top: -14vmax;
        left: -10vmax;
        background: radial-gradient(circle, rgba(30, 158, 232, 0.55), transparent 65%);
        animation: rsiAuroraA 12s ease-in-out infinite;
      }
      .rsi-splash-aurora-b {
        right: -16vmax;
        bottom: -16vmax;
        background: radial-gradient(circle, rgba(79, 182, 255, 0.42), transparent 65%);
        animation: rsiAuroraB 15s ease-in-out infinite;
      }
      .rsi-splash-scan {
        inset: 0;
        z-index: 3;
        opacity: 0.14;
        background-image: repeating-linear-gradient(
          to bottom,
          rgba(255, 255, 255, 0.18) 0,
          rgba(255, 255, 255, 0.18) 1px,
          transparent 1px,
          transparent 4px
        );
        animation: rsiScan 7s linear infinite;
      }

      .rsi-splash-hud {
        position: absolute;
        top: 20px;
        z-index: 4;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        font-size: 10px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.5);
        opacity: 0;
        animation: rsiFadeUp 0.7s ease 0.15s forwards;
      }
      .rsi-splash-hud-tl { left: 24px; }
      .rsi-splash-hud-tr { right: 24px; }
      .rsi-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #34d399;
        box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.6);
        animation: rsiDotPulse 1.6s ease-out infinite;
      }
      .rsi-splash-live {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        border-radius: 3px;
        background: #f43f5e;
        padding: 3px 6px;
        color: #fff;
        font-weight: 700;
        letter-spacing: 0.18em;
        margin-right: 4px;
      }
      .rsi-splash-live .rsi-dot { background: #fff; animation: none; box-shadow: none; }

      .rsi-splash-core {
        position: relative;
        z-index: 2;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding: 0 24px;
      }

      .rsi-splash-mark {
        position: relative;
        display: grid;
        place-items: center;
        width: 132px;
        height: 132px;
        margin-bottom: 26px;
        opacity: 0;
        transform: scale(0.82);
        animation: rsiMarkIn 0.9s cubic-bezier(0.2, 0.7, 0.2, 1) 0.1s forwards;
      }
      .rsi-splash-ring {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 1px solid rgba(79, 182, 255, 0.4);
      }
      .rsi-splash-ring-1 { animation: rsiRing 3s cubic-bezier(0.2, 0.6, 0.2, 1) infinite; }
      .rsi-splash-ring-2 { animation: rsiRing 3s cubic-bezier(0.2, 0.6, 0.2, 1) 0.8s infinite; }
      .rsi-splash-ring-3 {
        inset: 12px;
        border-style: dashed;
        border-color: rgba(79, 182, 255, 0.28);
        animation: rsiSpin 18s linear infinite;
      }
      .rsi-splash-glyph {
        position: relative;
        width: 66px;
        height: 66px;
        filter: drop-shadow(0 0 18px rgba(79, 182, 255, 0.65));
      }
      .rsi-splash-chip {
        position: absolute;
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.07);
        padding: 4px 9px;
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        font-size: 8.5px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.68);
        backdrop-filter: blur(6px);
        white-space: nowrap;
        animation: rsiFloat 5s ease-in-out infinite;
      }
      .rsi-splash-chip-a { top: 2px; left: -84px; }
      .rsi-splash-chip-b { bottom: 6px; right: -78px; animation-delay: -2.2s; }

      .rsi-splash-word {
        display: flex;
        flex-direction: column;
        gap: 2px;
        line-height: 1;
        opacity: 0;
        animation: rsiFadeUp 0.75s cubic-bezier(0.2, 0.7, 0.2, 1) 0.35s forwards;
      }
      .rsi-splash-name {
        font-size: clamp(2rem, 8vw, 2.9rem);
        font-weight: 600;
        letter-spacing: -0.035em;
        color: #fff;
      }
      .rsi-splash-name-alt {
        font-size: clamp(1.05rem, 4vw, 1.35rem);
        font-weight: 600;
        letter-spacing: 0.34em;
        text-transform: uppercase;
        background-image: linear-gradient(100deg, #4fb6ff, #a5e4ff, #4fb6ff);
        background-size: 200% auto;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        animation: rsiGradientPan 5s linear infinite;
      }
      .rsi-splash-tag {
        margin-top: 14px;
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        font-size: 9.5px;
        letter-spacing: 0.26em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.4);
        opacity: 0;
        animation: rsiFadeUp 0.75s cubic-bezier(0.2, 0.7, 0.2, 1) 0.55s forwards;
      }
      .rsi-splash-bar {
        position: relative;
        width: 172px;
        height: 3px;
        margin-top: 26px;
        border-radius: 999px;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.14);
        opacity: 0;
        animation: rsiFadeUp 0.6s ease 0.7s forwards;
      }
      .rsi-splash-bar span {
        position: absolute;
        inset: 0;
        transform-origin: left center;
        border-radius: inherit;
        background: linear-gradient(90deg, #0a7bce, #4fb6ff, #a5e4ff);
        box-shadow: 0 0 14px rgba(79, 182, 255, 0.8);
        animation: rsiBarFill 1.9s cubic-bezier(0.4, 0.1, 0.2, 1) 0.65s both;
      }
      .rsi-splash-bar span::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.75), transparent);
        animation: rsiBarSheen 1.4s ease-in-out 1.2s infinite;
      }
      .rsi-splash-status {
        margin-top: 12px;
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        font-size: 9px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.32);
        opacity: 0;
        animation: rsiFadeUp 0.6s ease 0.85s forwards;
      }
      .rsi-splash-ellipsis::after {
        content: '';
        animation: rsiEllipsis 1.4s steps(1) infinite;
      }

      .rsi-splash-foot {
        position: absolute;
        bottom: 22px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 4;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 8px 18px;
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        font-size: 8.5px;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.3);
        opacity: 0;
        animation: rsiFadeUp 0.7s ease 1s forwards;
      }
      .rsi-splash-foot span {
        display: inline-flex;
        align-items: center;
        gap: 18px;
      }
      .rsi-splash-foot span + span::before {
        content: '';
        width: 3px;
        height: 3px;
        border-radius: 50%;
        background: rgba(79, 182, 255, 0.6);
      }

      @keyframes rsiFadeUp {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes rsiMarkIn {
        from { opacity: 0; transform: scale(0.82); }
        to { opacity: 1; transform: scale(1); }
      }
      @keyframes rsiRing {
        0% { transform: scale(0.62); opacity: 0; }
        22% { opacity: 0.85; }
        100% { transform: scale(1.45); opacity: 0; }
      }
      @keyframes rsiSpin {
        to { transform: rotate(360deg); }
      }
      @keyframes rsiFloat {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-7px); }
      }
      @keyframes rsiGridDrift {
        from { background-position: 0 0, 0 0; }
        to { background-position: 46px 46px, 46px 46px; }
      }
      @keyframes rsiAuroraA {
        0%, 100% { transform: translate(0, 0) scale(1); }
        50% { transform: translate(6vmax, 4vmax) scale(1.12); }
      }
      @keyframes rsiAuroraB {
        0%, 100% { transform: translate(0, 0) scale(1.06); }
        50% { transform: translate(-5vmax, -4vmax) scale(0.96); }
      }
      @keyframes rsiScan {
        from { background-position: 0 0; }
        to { background-position: 0 100vh; }
      }
      @keyframes rsiDotPulse {
        0% { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.6); }
        70% { box-shadow: 0 0 0 8px rgba(52, 211, 153, 0); }
        100% { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0); }
      }
      @keyframes rsiBarFill {
        from { transform: scaleX(0); }
        to { transform: scaleX(1); }
      }
      @keyframes rsiBarSheen {
        from { transform: translateX(-120%); }
        to { transform: translateX(120%); }
      }
      @keyframes rsiGradientPan {
        to { background-position: 200% center; }
      }
      @keyframes rsiEllipsis {
        0% { content: ''; }
        25% { content: '.'; }
        50% { content: '..'; }
        75%, 100% { content: '...'; }
      }

      @media (max-width: 480px) {
        .rsi-splash-chip { display: none; }
        .rsi-splash-hud-tr { display: none; }
        .rsi-splash-hud-tl { left: 16px; }
      }
      @media (prefers-reduced-motion: reduce) {
        #rsi-splash *,
        #rsi-splash *::before,
        #rsi-splash *::after {
          animation-duration: 0.001ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.001ms !important;
        }
        #rsi-splash .rsi-splash-bar span { transform: scaleX(1); }
      }
    </style>
  </head>
  <body>
    <div id="rsi-splash" role="status" aria-live="polite" aria-label="Loading Reagansoft Innovation">
      <div class="rsi-splash-bg">
        <span class="rsi-splash-grid"></span>
        <span class="rsi-splash-aurora rsi-splash-aurora-a"></span>
        <span class="rsi-splash-aurora rsi-splash-aurora-b"></span>
      </div>

      <div class="rsi-splash-hud rsi-splash-hud-tl">
        <span class="rsi-splash-live"><span class="rsi-dot"></span>Live</span> RSI Studio
      </div>
      <div class="rsi-splash-hud rsi-splash-hud-tr">On air &middot; Jinja, Uganda</div>

      <div class="rsi-splash-core">
        <div class="rsi-splash-mark">
          <span class="rsi-splash-ring rsi-splash-ring-1"></span>
          <span class="rsi-splash-ring rsi-splash-ring-2"></span>
          <span class="rsi-splash-ring rsi-splash-ring-3"></span>
          <span class="rsi-splash-chip rsi-splash-chip-a">Engineering</span>
          <span class="rsi-splash-chip rsi-splash-chip-b">Deploying</span>
          <svg class="rsi-splash-glyph" viewBox="0 0 120 120" fill="none" aria-hidden="true">
            <defs>
              <linearGradient id="rsi-splash-grad" x1="18" y1="16" x2="104" y2="104" gradientUnits="userSpaceOnUse">
                <stop offset="0" stop-color="#a5e4ff" />
                <stop offset="0.55" stop-color="#4fb6ff" />
                <stop offset="1" stop-color="#0a7bce" />
              </linearGradient>
            </defs>
            <path d="M38 94V28h27a20 20 0 0 1 0 40H47" stroke="url(#rsi-splash-grad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M62 68l26 26" stroke="url(#rsi-splash-grad)" stroke-width="7" stroke-linecap="round" />
            <circle cx="99" cy="24" r="5" fill="#a5e4ff" />
          </svg>
        </div>

        <div class="rsi-splash-word">
          <span class="rsi-splash-name">Reagansoft</span>
          <span class="rsi-splash-name-alt">Innovation</span>
        </div>
        <p class="rsi-splash-tag">Engineering studio &middot; Jinja, Uganda</p>

        <div class="rsi-splash-bar"><span></span></div>
        <p class="rsi-splash-status">Booting the live studio<span class="rsi-splash-ellipsis"></span></p>
      </div>

      <div class="rsi-splash-foot">
        <span>Websites</span>
        <span>Systems</span>
        <span>Commerce</span>
        <span>Apps</span>
        <span>Support</span>
      </div>

      <span class="rsi-splash-scan"></span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
